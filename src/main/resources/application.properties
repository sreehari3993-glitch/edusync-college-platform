# Server Port (supports cloud PORT variable, default 8081)
server.port=${PORT:8081}

# Frontend HTML served by Spring Boot
edusync.frontend.html-path=classpath:/static/index.html

# ─── MySQL Database Configuration ───
# Supports cloud DB_URL or DB_HOST/DB_PORT/DB_NAME, with fallback to local MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:edusync_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:SREEHARI_99}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── JWT Security ───
edusync.jwt.secret=${JWT_SECRET:EduSync_TKMIT_SecretKey_2025_CollegeDigitalPlatform_SuperSecure}
edusync.jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── File Upload ───
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
edusync.upload.dir=${UPLOAD_DIR:uploads/}

# ─── CORS ───
edusync.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500,http://localhost:8081,http://127.0.0.1:8081,http://localhost:63342,http://127.0.0.1:63342,http://localhost:5173,http://127.0.0.1:5173}

# ─── Logging ───
logging.level.com.edusync=INFO
logging.level.org.springframework.security=WARN

# ─── Google Drive Cloud Sync ───
google.drive.folder-id=1pNjlidTeVa71u0FH4_-PBHhVG6jTtiI4
google.drive.credentials-path=${GOOGLE_DRIVE_CREDENTIALS:credentials.json}
google.drive.auto-sync.enabled=true

