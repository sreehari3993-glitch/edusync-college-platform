# ─────────────────────────────────────────────
#  EduSync — Application Properties
#  College: TKM Institute of Technology, Kollam
# ─────────────────────────────────────────────

# Server Port (supports cloud PORT variable, default 8081)
server.port=${PORT:8081}

# Frontend HTML served by Spring Boot
edusync.frontend.html-path=classpath:/static/index.html

# ─── MySQL Database Configuration ───
# Supports cloud DB_URL or DB_HOST/DB_PORT/DB_NAME, with fallback to local MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:edusync_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:SREEHARI_99}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── JWT Security ───
edusync.jwt.secret=${JWT_SECRET:EduSync_TKMIT_SecretKey_2025_CollegeDigitalPlatform_SuperSecure}
edusync.jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── File Upload ───
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
edusync.upload.dir=${UPLOAD_DIR:uploads/}

# ─── CORS ───
edusync.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500,http://localhost:8081,http://127.0.0.1:8081,http://localhost:63342,http://127.0.0.1:63342,http://localhost:5173,http://127.0.0.1:5173}

# ─── Logging ───
logging.level.com.edusync=INFO
logging.level.org.springframework.security=WARN
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=OFF
spring.jpa.open-in-view=false

# ─── Google Drive Cloud Sync ───
google.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID:}
google.drive.shared-drive-id=${GOOGLE_DRIVE_SHARED_DRIVE_ID:${GOOGLE_DRIVE_SHARED_FOLDER_ID:}}
google.drive.credentials-path=${GOOGLE_DRIVE_CREDENTIALS:credentials.json}
google.drive.auto-sync.enabled=true

# ─── Local Storage Fallback ───
edusync.storage.local-fallback-dir=${LOCAL_STORAGE_FALLBACK_DIR:uploads/fallback}

# ─── Concurrency & Connection Pool Optimization (Supports 100+ Users) ───
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=8192
server.tomcat.accept-count=100
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000

# ─── Spring Mail Configuration ───
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:edusyncofc@gmail.com}
spring.mail.password=${SMTP_PASSWORD:hfjsvpxswqfzwrdc}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQ:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
edusync.mail.enabled=${MAIL_ENABLED:true}
edusync.mail.from-address=${MAIL_FROM:edusyncofc@gmail.com}
edusync.mail.from-name=EduSync TKMIT Academic Portal


